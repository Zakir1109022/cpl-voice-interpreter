[project]
name = "cpl-meeting-interpreter-agent"
version = "0.1.0"
description = "Real-time bidirectional Bengali <-> English meeting interpreter built on LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents~=1.8",
    "livekit-api>=1.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["web", "docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.uv]
package = false
